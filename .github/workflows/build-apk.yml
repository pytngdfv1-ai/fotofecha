name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install
        
      - name: Remove old Android folder (if exists)
        run: rm -rf android
        
      - name: Add Android platform
        run: npx cap add android
        
      - name: Generate Capacitor assets (icons)
        run: npx capacitor-assets generate --iconBackgroundColor '#121212' --iconBackgroundColorDark '#121212'
        
      - name: Copy web assets and sync plugins
        run: npx cap sync android
        
      # Paso opcional para depurar qué plugins se incluyeron
      - name: List Capacitor plugins in assets (debug)
        run: |
          echo "Contenido de android/app/src/main/assets/public:"
          ls -la android/app/src/main/assets/public/
          echo "Plugins Capacitor:"
          ls -la android/app/src/main/assets/public/capacitor/plugins/ 2>/dev/null || echo "No se encontró carpeta de plugins"
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
